openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mia
    description: Mia AI assistant operations
  - name: finance
    description: Finance enquiry operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mia/chat:
    post:
      operationId: miaChat
      tags: [mia]
      summary: Stream a chat response from the Mia assistant
      description: >
        Stateless chat endpoint. The client sends the full conversation history
        and receives a Server-Sent Events (text/event-stream) stream of
        `{ "content": string }` chunks, terminated by `{ "done": true }`.
        Note: this is an SSE endpoint, so no response hook/schema is generated by codegen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiaChatInput"
      responses:
        "200":
          description: Server-Sent Events stream of assistant content chunks
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request body
        "500":
          description: Mia is unavailable
  /finance/enquiry:
    post:
      operationId: financeEnquiry
      tags: [finance]
      summary: Submit a Stratton Finance lead enquiry
      description: >
        Accepts a loan enquiry from the MissingCash Finance page and emails the
        lead details to the Stratton Finance consultant (erin.crofton@stratton.com.au).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEnquiryInput"
      responses:
        "200":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceEnquiryResult"
        "400":
          description: Invalid request body
        "500":
          description: Failed to process enquiry
  /search/submit:
    post:
      operationId: searchSubmit
      tags: [search]
      summary: Submit a money search request
      description: >
        Saves a user's personal details so Mia can search all Australian unclaimed money
        databases on their behalf. Returns the created submission ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchSubmitInput"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSubmitResult"
        "400":
          description: Invalid request body
        "500":
          description: Failed to save submission
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MiaChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - role
        - content
    MiaChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/MiaChatMessage"
      required:
        - messages
    FinanceEnquiryInput:
      type: object
      required: [loanType, loanAmount, preferredTerm, firstName, lastName, email, phone, postcode]
      properties:
        loanType:
          type: string
          enum: [car, boat, home, personal]
        loanAmount:
          type: number
          minimum: 1000
        preferredTerm:
          type: integer
          minimum: 1
        estimatedMonthly:
          type: number
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 6
        postcode:
          type: string
          minLength: 4
          maxLength: 4
        message:
          type: string
    SearchSubmitInput:
      type: object
      required: [firstName, lastName, email, dob, addressLine, suburb, state, postcode]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        dob:
          type: string
          description: Date of birth in YYYY-MM-DD format
          pattern: '^\d{4}-\d{2}-\d{2}$'
        addressLine:
          type: string
          minLength: 1
        suburb:
          type: string
          minLength: 1
        state:
          type: string
          enum: [NSW, VIC, QLD, WA, SA, TAS, ACT, NT]
        postcode:
          type: string
          minLength: 4
          maxLength: 4
    SearchSubmitResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        submissionId:
          type: integer
        error:
          type: string
    FinanceEnquiryResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
