openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mia
    description: Mia AI assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mia/chat:
    post:
      operationId: miaChat
      tags: [mia]
      summary: Stream a chat response from the Mia assistant
      description: >
        Stateless chat endpoint. The client sends the full conversation history
        and receives a Server-Sent Events (text/event-stream) stream of
        `{ "content": string }` chunks, terminated by `{ "done": true }`.
        Note: this is an SSE endpoint, so no response hook/schema is generated by codegen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiaChatInput"
      responses:
        "200":
          description: Server-Sent Events stream of assistant content chunks
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request body
        "500":
          description: Mia is unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MiaChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - role
        - content
    MiaChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/MiaChatMessage"
      required:
        - messages

